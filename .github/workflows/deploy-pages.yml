name: Deploy Hockey Coach to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "assets/**"
      - "hockey-coach-site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download hero image for the site
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://images.pexels.com/photos/6468721/pexels-photo-6468721.jpeg?auto=compress&cs=tinysrgb&w=1600' \
            --output assets/hockey-hero.jpg
          test "$(wc -c < assets/hockey-hero.jpg)" -gt 10000

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
